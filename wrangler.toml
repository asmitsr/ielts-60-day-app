name = "ielts-60-day-app"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

# Plain (non-secret) variables. Secrets go via `wrangler pages secret put`.
[vars]
# Set to "false" to disable open registration (private deployment).
ALLOW_REGISTRATION = "false"

[[d1_databases]]
binding = "DB"
database_name = "ielts-60day-db"
# Production D1 database (created 22 Nov 2026 via API).
database_id = "bb3c38eb-efbb-46ac-856d-bd44a41e5236"
migrations_dir = "migrations"
